<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <!-- Hand-made, hazy, desaturated landscape plate for the style trial (no external image). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfefb"/>
      <stop offset="0.55" stop-color="#eef1e7"/>
      <stop offset="1" stop-color="#dfe5d8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.3" r="0.35">
      <stop offset="0" stop-color="#fffef6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffef6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9f5" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f8f9f5" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f8f9f5" stop-opacity="0"/>
    </linearGradient>
    <filter id="haze" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>
  <rect width="1600" height="600" fill="url(#sun)"/>

  <!-- Far ridges, lost in haze -->
  <path filter="url(#haze)" fill="#c9d5c5" opacity="0.7"
        d="M0 330 C 140 290 260 300 380 270 C 520 236 610 280 760 250 C 900 222 1010 262 1150 236 C 1300 208 1440 250 1600 226 L1600 600 L0 600 Z"/>
  <path filter="url(#haze)" fill="#b4c2ae" opacity="0.65"
        d="M0 372 C 180 338 300 360 450 334 C 600 308 700 350 860 326 C 1020 302 1130 344 1290 318 C 1420 298 1520 322 1600 312 L1600 600 L0 600 Z"/>

  <!-- Middle hills -->
  <path filter="url(#soft)" fill="#9aae94" opacity="0.75"
        d="M0 420 C 160 392 280 408 420 384 C 560 360 690 402 840 386 C 990 370 1100 404 1250 382 C 1400 362 1500 388 1600 380 L1600 600 L0 600 Z"/>
  <rect y="330" width="1600" height="140" fill="url(#mist)"/>

  <!-- Tree line -->
  <g fill="#6f8669" opacity="0.7" filter="url(#soft)">
    <path d="M0 462 C 60 444 120 452 170 440 C 230 426 300 446 360 438 C 430 428 470 450 540 444 C 610 438 660 452 730 446 C 790 440 820 470 870 468 C 920 466 940 440 1000 440 C 1060 440 1080 430 1110 434 C 1190 420 1260 442 1340 432 C 1420 422 1500 444 1600 436 L1600 600 L0 600 Z"/>
  </g>

  <!-- Near meadow -->
  <path fill="#7f9578" opacity="0.85"
        d="M0 500 C 220 470 380 492 560 478 C 760 462 900 494 1100 480 C 1300 466 1450 490 1600 482 L1600 600 L0 600 Z"/>
  <path fill="#5f7759" opacity="0.8"
        d="M0 548 C 260 524 420 544 640 532 C 860 520 1040 548 1260 536 C 1420 528 1520 540 1600 536 L1600 600 L0 600 Z"/>

  <!-- A thin river of light -->
  <path fill="none" stroke="#f2f4ec" stroke-width="3" opacity="0.7" filter="url(#soft)"
        d="M1040 486 C 980 500 1010 516 930 528 C 850 540 880 560 760 576"/>

  <rect width="1600" height="600" filter="url(#grain)"/>
</svg>
